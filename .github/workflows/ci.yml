name: CI

"on":
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest

  ssh-connectivity-test:
    name: SSH connectivity test
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH access
        env:
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DO_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' '45.55.86.55 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOMxM4o/pizcYeXQbpy+dgODL552/wJiujXQGRtpoyGF' > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Verify SSH connectivity
        run: |
          ssh -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" deploy@45.55.86.55 "hostname; docker ps --format '{{.Names}}'"

      - name: Clean up SSH credentials
        if: always()
        run: |
          rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

  docker-build:
    name: Docker build, scan, and push
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image for local scan
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          pull: true
          no-cache: true
          tags: |
            ghcr.io/hashirislamdawar/fastapi-digitalocean-cicd:latest
            ghcr.io/hashirislamdawar/fastapi-digitalocean-cicd:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report Trivy vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/hashirislamdawar/fastapi-digitalocean-cicd:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          vuln-type: os,library
          exit-code: "0"

      - name: Gate on fixable Trivy vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/hashirislamdawar/fastapi-digitalocean-cicd:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: "1"

      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/hashirislamdawar/fastapi-digitalocean-cicd:latest
          docker push ghcr.io/hashirislamdawar/fastapi-digitalocean-cicd:${{ github.sha }}

  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure SSH access
        env:
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DO_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' '45.55.86.55 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOMxM4o/pizcYeXQbpy+dgODL552/wJiujXQGRtpoyGF' > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy immutable GHCR image
        run: |
          ssh -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" deploy@45.55.86.55 "NEW_IMAGE='ghcr.io/hashirislamdawar/fastapi-digitalocean-cicd:${{ github.sha }}' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          echo "Deploying image: $NEW_IMAGE"

          if ! docker inspect fastapi-api >/dev/null 2>&1; then
            echo "Existing container fastapi-api does not exist; refusing to assume an old image."
            exit 1
          fi

          OLD_IMAGE="$(docker inspect --format '{{.Config.Image}}' fastapi-api)"
          if [ -z "$OLD_IMAGE" ]; then
            echo "Could not determine the image used by fastapi-api."
            exit 1
          fi
          echo "Current image: $OLD_IMAGE"

          docker pull "$NEW_IMAGE"
          docker image inspect "$NEW_IMAGE" >/dev/null

          docker stop fastapi-api
          docker rm fastapi-api
          docker run -d \
            --name fastapi-api \
            -p 127.0.0.1:8000:8000 \
            --restart unless-stopped \
            "$NEW_IMAGE"

          rollback_and_fail() {
            echo "Deployment health check failed. Docker diagnostics:"
            docker ps -a
            docker logs --tail 100 fastapi-api || true

            echo "Starting rollback to previous image: $OLD_IMAGE"
            if docker ps -a --filter "name=^/fastapi-api$" --format '{{.Names}}' | grep -qx fastapi-api; then
              docker stop fastapi-api || true
              docker rm fastapi-api || true
            fi

            rollback_failed=0
            if ! docker image inspect "$OLD_IMAGE" >/dev/null 2>&1; then
              echo "Previous image is not available locally: $OLD_IMAGE"
              rollback_failed=1
            elif ! docker run -d \
              --name fastapi-api \
              -p 127.0.0.1:8000:8000 \
              --restart unless-stopped \
              "$OLD_IMAGE"; then
              rollback_failed=1
            fi

            sleep 5

            if [ "$rollback_failed" -eq 0 ]; then
              if ! docker ps --filter "name=^/fastapi-api$" --filter status=running --format '{{.Names}}' | grep -qx fastapi-api; then
                rollback_failed=1
              fi
            fi

            if [ "$rollback_failed" -eq 0 ]; then
              if ! curl --fail --silent --show-error http://127.0.0.1:8000/health >/dev/null; then
                rollback_failed=1
              fi
            fi

            if [ "$rollback_failed" -eq 0 ]; then
              if ! curl --fail --silent --show-error http://127.0.0.1/health >/dev/null; then
                rollback_failed=1
              fi
            fi

            if [ "$rollback_failed" -ne 0 ]; then
              echo "Rollback failed. Docker diagnostics:"
              docker ps -a
              docker logs --tail 100 fastapi-api || true
              exit 1
            fi

            echo "Rollback successful. Restored previous image: $OLD_IMAGE"
            exit 1
          }

          health_status=""
          health_elapsed=0
          while [ "$health_elapsed" -lt 60 ]; do
            health_status="$(docker inspect --format '{{.State.Health.Status}}' fastapi-api 2>/dev/null || true)"
            echo "Docker health status after ${health_elapsed}s: ${health_status:-unavailable}"

            case "$health_status" in
              healthy)
                break
                ;;
              unhealthy)
                echo "Docker health status is unhealthy."
                rollback_and_fail
                ;;
              "")
                echo "Docker has not reported a health status yet."
                ;;
              *)
                echo "Waiting for Docker health status to become healthy."
                ;;
            esac

            sleep 2
            health_elapsed=$((health_elapsed + 2))
          done

          if [ "$health_status" != "healthy" ]; then
            echo "Docker health status did not become healthy within 60 seconds."
            rollback_and_fail
          fi

          if ! DIRECT_RESPONSE="$(curl --fail --silent --show-error http://127.0.0.1:8000/health)"; then
            rollback_and_fail
          fi
          if [ "$DIRECT_RESPONSE" != '{"status":"healthy"}' ]; then
            echo "Unexpected direct health response: $DIRECT_RESPONSE"
            rollback_and_fail
          fi
          echo "Health check: $DIRECT_RESPONSE"

          if ! docker ps --filter "name=^/fastapi-api$" --filter status=running --format '{{.Names}}' | grep -qx fastapi-api; then
            rollback_and_fail
          fi
          docker ps

          if ! NGINX_RESPONSE="$(curl --fail --silent --show-error http://127.0.0.1/health)"; then
            rollback_and_fail
          fi
          if [ "$NGINX_RESPONSE" != '{"status":"healthy"}' ]; then
            echo "Unexpected Nginx health response: $NGINX_RESPONSE"
            rollback_and_fail
          fi
          echo "Nginx health check: $NGINX_RESPONSE"
          REMOTE_SCRIPT

      - name: Clean up SSH credentials
        if: always()
        run: |
          rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"