name: CI

"on":
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest

  docker-build:
    name: Docker build, scan, and push
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image for local scan
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          pull: true
          no-cache: true
          tags: |
            ghcr.io/hashirislamdawar/fastapi-digitalocean-cicd:latest
            ghcr.io/hashirislamdawar/fastapi-digitalocean-cicd:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/hashirislamdawar/fastapi-digitalocean-cicd:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          vuln-type: os,library
          exit-code: "1"

      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/hashirislamdawar/fastapi-digitalocean-cicd:latest
          docker push ghcr.io/hashirislamdawar/fastapi-digitalocean-cicd:${{ github.sha }}